	footer = [
		"#N&r&8▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬#N&r&7Joueurs &#28E0FF&l#PLAYERCOUNT&r&8/&7#MAXPLAYERS   &8•   &7TPS #CTPS   &8•   &7RAM &#7B3FE4#MEMORY#N&r&8#DATE  &7#TIME#N",
		"#N&r&8▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬#N&r&7Joueurs &#28E0FF&l#PLAYERCOUNT&r&8/&7#MAXPLAYERS   &8•   &7TPS #CTPS   &8•   &7RAM &#7B3FE4#MEMORY#N&r&7En ligne depuis &#7B3FE4#UPTIME#N"
	]
	#Display name format.
	display_name_format = "{prefix}&f{name} &8[&#28E0FF{ping}ms&8] &7#AFK"
	#How often (ms) the tab list refreshes. Range: 1-10000. Default: 500.
	update_interval = 500
	#Update cycles between animation frame changes. Range: 1-200. Default: 4.
	animation_interval = 2
	#Name formatting and rank sorting provider: NONE, FTB, or LP (LuckPerms).
	name_formatting_provider = "FTB"

[sorting]
	#How to sort players: NONE, ALPHABETICAL, or RANK.
	sort_mode = "ALPHABETICAL"

[afk]
	afk_enabled = true
	afk_timeout = 300

[performance]
	metrics_provider = "VANILLA"